name: Weekly playlist refresh

on:
  schedule:
    - cron: "23 13 * * 2"   # Tuesday 13:23 UTC — plain UTC, odd minute off the top-of-hour.
                            # Next run is ~24h out, giving GitHub a full day to register it.
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

permissions:
  contents: write            # allow committing the updated data/ snapshot

concurrency:
  group: playlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # safety net; a healthy full run is ~25 min
    steps:
      - uses: actions/checkout@v6      # Node 24 (v4 ran Node 20, removed from runners 2026-09-16)

      - uses: actions/setup-python@v6  # Node 24
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build / refresh playlist
        env:
          PYTHONUNBUFFERED: "1"   # stream progress logs live to the Actions console
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: python -u -m src.build_playlist

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet --staged; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly playlist refresh $(date -u +%F)"
            # rebase onto anything pushed during the run, then push (avoids a
            # non-fast-forward failure if a commit landed while we were running)
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
